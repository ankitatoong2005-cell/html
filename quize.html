<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Quiz App </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            text-align: center;
        }
        .quiz-container {
            width: 500px;
            margin: 80px;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px gray;
        }
            h1{
            color: purple;
            }

            h2{
            color: #333;
            }

        .option{
           
            margin: 15px;
            font-size: 18px;
        }

        input[type="radio"] 
        {
            margin-right: 10px;
        }

        .next-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background-color: purple;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .next-btn:hover {
            background-color: darkviolet;
        }
    </style>
</head>
<body>
    <div class="quiz-container">

        <h1> Quiz App </h1>

        <h2> 1. What is the capital of India? </h2>

            <input type="radio" name="q1"> Mumbai
        
            <input type="radio" name="q1"> New Delhi
      
            <input type="radio" name="q1"> Kolkata
      
            <input type="radio" name="q1"> Chennai
        
        <a href="a.html" class="next-btn">Next Page</a>
    </div>
</body>
</html>
